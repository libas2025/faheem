<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | LIBAS TAILOR Private Portal</title>

  <!-- STRICT BOT DISALLOW / NOINDEX -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/styles.css">

  <style>
    .admin-login-card {
      background: #FFFFFF;
      border: 1px solid rgba(85, 16, 15, 0.15);
      box-shadow: 0 20px 40px -15px rgba(33, 26, 26, 0.1);
    }
    .admin-input {
      width: 100%;
      background: #FAF8F5;
      border: 1px solid rgba(33, 26, 26, 0.2);
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: #211A1A;
      outline: none;
      transition: all 0.2s ease;
    }
    .admin-input:focus {
      border-color: #55100F;
      background: #FFFFFF;
      box-shadow: 0 0 0 2px rgba(85, 16, 15, 0.1);
    }
  </style>
</head>
<body class="bg-luxury-ivory text-charcoal min-h-screen flex flex-col justify-between selection:bg-burgundy-royal selection:text-white">

  <!-- Minimal Brand Header -->
  <header class="py-6 px-6 border-b border-antique-gold/20 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3">
      <img src="/images/logo.webp" alt="LIBAS TAILOR" width="130" height="32" class="h-8 w-auto">
    </a>
    <span class="font-brand text-[11px] uppercase tracking-widest text-burgundy-royal font-semibold">
      Private Portal
    </span>
  </header>

  <!-- Login Main Container -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md admin-login-card p-8 sm:p-10 relative">

      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-burgundy-royal/5 text-burgundy-royal mb-4 border border-burgundy-royal/15">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <h1 class="font-serif text-2xl font-bold text-charcoal tracking-wide mb-1">Gallery Administrator</h1>
        <p class="font-sans text-xs text-charcoal/70">
          Authorized personnel access for photo publishing
        </p>
      </div>

      <!-- Error / Alert Message Container -->
      <div id="login-alert" class="hidden mb-5 p-3.5 bg-red-50 border border-red-200 text-red-700 text-xs rounded-sm"></div>

      <!-- Login Form -->
      <form id="admin-login-form" class="space-y-4">
        <div>
          <label for="admin-email" class="block font-brand text-xs font-semibold text-charcoal mb-1 tracking-wider uppercase">
            Email Address
          </label>
          <input
            type="email"
            id="admin-email"
            required
            autocomplete="email"
            value="libastailor0@gmail.com"
            class="admin-input"
            placeholder="libastailor0@gmail.com"
          >
        </div>

        <div>
          <label for="admin-password" class="block font-brand text-xs font-semibold text-charcoal mb-1 tracking-wider uppercase">
            Password
          </label>
          <input
            type="password"
            id="admin-password"
            required
            autocomplete="current-password"
            class="admin-input"
            placeholder="••••••••••••"
          >
        </div>

        <button
          type="submit"
          id="login-btn"
          class="w-full btn-primary py-3 text-xs tracking-widest font-semibold uppercase flex items-center justify-center gap-2 mt-6 shadow-md"
        >
          <span id="login-btn-text">SIGN IN TO DASHBOARD</span>
          <svg id="login-spinner" class="hidden animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-charcoal/10 text-center">
        <a href="/" class="text-xs text-charcoal/60 hover:text-burgundy-royal transition-colors">
          &larr; Return to Public Website
        </a>
      </div>
    </div>
  </main>

  <!-- Minimal Footer -->
  <footer class="py-4 text-center text-xs text-charcoal/50 border-t border-charcoal/10">
    LIBAS TAILOR &bull; Shamshad Market, AMU Aligarh &bull; Confidential &amp; Protected
  </footer>

  <script type="module">
    import { signInAdmin, getSession, checkIsAdmin } from '/src/lib/supabase.js';

    const loginForm = document.getElementById('admin-login-form');
    const alertBox = document.getElementById('login-alert');
    const loginBtn = document.getElementById('login-btn');
    const btnText = document.getElementById('login-btn-text');
    const spinner = document.getElementById('login-spinner');

    function showAlert(msg) {
      alertBox.textContent = msg;
      alertBox.classList.remove('hidden');
    }

    function hideAlert() {
      alertBox.classList.add('hidden');
      alertBox.textContent = '';
    }

    function setLoading(isLoading) {
      if (isLoading) {
        loginBtn.disabled = true;
        btnText.textContent = 'VERIFYING...';
        spinner.classList.remove('hidden');
      } else {
        loginBtn.disabled = false;
        btnText.textContent = 'SIGN IN TO DASHBOARD';
        spinner.classList.add('hidden');
      }
    }

    // Check if already authenticated and authorized
    async function checkExistingAuth() {
      const session = await getSession();
      if (session && session.user) {
        const isAdmin = await checkIsAdmin(session.user.id);
        if (isAdmin) {
          window.location.replace('/admin/');
        }
      }
    }
    checkExistingAuth();

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      setLoading(true);

      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;

      try {
        const res = await signInAdmin(email, password);
        if (!res.success) {
          showAlert(res.error || 'Authentication failed.');
          setLoading(false);
          return;
        }

        // Successfully authenticated as administrator
        window.location.replace('/admin/');
      } catch (err) {
        showAlert('An unexpected error occurred during login. Please try again.');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
